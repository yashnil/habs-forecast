[project]
name = "coastwatch-pipeline"
version = "0.1.0"
description = "CoastWatch data pipeline: ingest, validate, render and publish static artifacts"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pillow>=10.0",
  "pydantic>=2.6",
]

[project.scripts]
cwp = "coastwatch_pipeline.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["coastwatch_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits upstream servers (deselect with -m 'not live')"]
addopts = "-m 'not live'"
