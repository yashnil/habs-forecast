<body>
<div id="map"></div>
<div class="bar">

  <div class="group" id="presets" role="radiogroup" aria-label="Zoom preset"></div>

<script type="module">
import * as maplibregl from "https://unpkg.com/maplibre-gl@6.13.0/dist/maplibre-gl.mjs";

// ---------------------------------------------------------------- constants
const T0 = performance.now();
const TODAY = "2026-10-15";
const SEA = "#0b1d33", LAND = "#2a3646";
const FONT = ["Noto Sans Regular"], FONT_ITALIC = ["Noto Sans Italic"];
const OMT = "https://tiles.openfreemap.org/planet";
const POSITRON = "https://tiles.openfreemap.org/styles/positron";
const UPSAMPLE = 4; // image pixels per grid cell (east-west) in the whole-grid image
const DETAIL_Z = 8; // from this zoom the field is drawn from the viewport image (water clip at device resolution)
const RASTER_OPACITY = 0.72; // T1-T3 (see CRITIQUE.md for the rounds)
const KM_PER_DEG = 111.32;

const TREATMENTS = {
  T0: { label: "T0 Baseline", desc: "Current 10-step purple, opaque", light: false, opacity: 1, ramp: "published", outlines: false, labels: false, harbor: false, hatch: "dots" },
  T1: { label: "T1 Translucent", desc: "Uniform ramp at 0.72 over the relief", light: false, opacity: RASTER_OPACITY, ramp: "display", outlines: false, labels: false, harbor: false, hatch: "quiet" },
  T2: { label: "T2 Outlines", desc: "T1 + zoom-adaptive cell outlines and values", light: false, opacity: RASTER_OPACITY, ramp: "display", outlines: true, labels: true, harbor: false, hatch: "quiet" },
  T3: { label: "T3 Harbor", desc: "T2 + nearshore gap, stations, context ring", light: false, opacity: RASTER_OPACITY, ramp: "display", outlines: true, labels: true, harbor: true, hatch: "explicit" },
  T4: { label: "T4 Light", desc: "T2 on a light basemap", light: true, opacity: 0.75, ramp: "display", outlines: true, labels: true, harbor: false, hatch: "light" },
};
const PRESETS = {
  regional: { label: "Regional", center: [-121.6, 37.1], zoom: 5.5, harbor: null },
  bay: { label: "Bay", center: [-121.98, 36.78], zoom: 9, harbor: "monterey" },
  harbor: { label: "Harbor", center: [-121.89, 36.605], zoom: 12, harbor: "monterey" },
  crescent: { label: "Crescent City", center: [-124.19, 41.745], zoom: 12, harbor: "crescent" },
};
const HARBORS = {
  monterey: { name: "Monterey harbor", lat: 36.605, lon: -121.89 },
  crescent: { name: "Crescent City harbor", lat: 41.745, lon: -124.19 },
};

// ---------------------------------------------------------------- data loading
const perf = { marks: {} };
const mark = (k) => (perf.marks[k] = +(performance.now() - T0).toFixed(0));
const [layersFile, rampFile, stationsFile, reliefMeta, waterFile] = await Promise.all([
  fetch("data/layers.json").then((r) => r.json()),
  fetch("data/ramp.json").then((r) => r.json()),
  fetch("data/stations.json").then((r) => r.json()),
  fetch("data/relief.json").then((r) => r.json()),
  fetch("data/water-fallback.json").then((r) => r.json()),
]);
mark("meta");

const layers = Object.values(layersFile.layers);
const variableSel = document.getElementById("variable");
for (const l of layers) variableSel.append(new Option(l.short_title, l.layer_id));

async function decodeGrid(url) {
  const t0 = performance.now();
  const r = await fetch(url);
  const gz = await r.arrayBuffer();
  const tFetch = performance.now() - t0;
  const buf = await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer();
  const view = new DataView(buf);
  const out = new Uint16Array(buf.byteLength / 2);
  for (let i = 0; i < out.length; i++) out[i] = view.getUint16(i * 2, true);
  return { codes: out, gzBytes: gz.byteLength, tFetch: +tFetch.toFixed(0), tDecode: +(performance.now() - t0 - tFetch).toFixed(0) };
}
const gridCache = new Map();
const loadGrid = (l) => gridCache.get(l.layer_id) ?? gridCache.set(l.layer_id, decodeGrid(l.grid.url)).get(l.layer_id);

// Water (the product's bundled OpenMapTiles ocean, normalised Web Mercator, y down): used only to
// clip the drawn field and the no-value hatch to the sea, as the product does. Never changes a value.
const water = (() => {
  const rings = [], polygons = [];
  for (const poly of waterFile.polygons) {
    const ids = [];
    for (const enc of poly) {
      const r = new Float64Array(enc.length);
      let x = 0, y = 0;
      for (let i = 0; i < enc.length; i += 2) { x += enc[i]; y += enc[i + 1]; r[i] = x / waterFile.quant; r[i + 1] = y / waterFile.quant; }
      ids.push(rings.length);
      rings.push(r);
    }
    polygons.push(ids);
  }
  const bbox = rings.map((r) => { const b = [Infinity, Infinity, -Infinity, -Infinity]; for (let i = 0; i < r.length; i += 2) { b[0] = Math.min(b[0], r[i]); b[2] = Math.max(b[2], r[i]); b[1] = Math.min(b[1], r[i + 1]); b[3] = Math.max(b[3], r[i + 1]); } return b; });
  return { rings, bbox, polygons };
})();

// ---------------------------------------------------------------- geometry helpers
const mercX = (lon) => (lon + 180) / 360;
const mercY = (lat) => (1 - Math.log(Math.tan((lat * Math.PI) / 180) + 1 / Math.cos((lat * Math.PI) / 180)) / Math.PI) / 2;
const latOfY = (y) => (Math.atan(Math.sinh(Math.PI * (1 - 2 * y))) * 180) / Math.PI;
const distanceKm = (lat1, lon1, lat2, lon2) => Math.hypot((lat2 - lat1) * KM_PER_DEG, (lon2 - lon1) * KM_PER_DEG * Math.cos((((lat1 + lat2) / 2) * Math.PI) / 180));
const cellAt = (g, lat, lon) => {
  const row = Math.floor((lat - g.lat_first) / g.lat_step + 0.5), col = Math.floor((lon - g.lon_first) / g.lon_step + 0.5);
  if (row < 0 || row >= g.height || col < 0 || col >= g.width) return null;
  return { row, col, lat: g.lat_first + row * g.lat_step, lon: g.lon_first + col * g.lon_step };
};
const valueOf = (g, codes, c) => { const code = codes[c.row * g.width + c.col]; return code === g.nodata ? null : code * g.scale_factor + g.add_offset; };
const gridBounds = (g) => ({ west: g.lon_first - g.lon_step / 2, east: g.lon_first + (g.width - 0.5) * g.lon_step, south: g.lat_first - g.lat_step / 2, north: g.lat_first + (g.height - 0.5) * g.lat_step });

// Pipeline step rule: class = last stop whose value <= v (searchsorted side=right - 1), domain-clipped.
function classIndex(stops, domain, v) {
  const x = Math.min(domain[1], Math.max(domain[0], v));
  let i = 0;
  while (i + 1 < stops.length && stops[i + 1].value <= x) i++;
  return i;
}
const hexRgb = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
/** Colour of every possible grid code (packed RGBA, little-endian), alpha = the layer opacity; no-data = 0 (transparent). */
function makeLut(g, palette, opacity) {
  const a = Math.round(opacity * 255);
  const cols = palette.stops.map((s) => { const [r, g2, b2] = hexRgb(s.color); return ((a << 24) | (b2 << 16) | (g2 << 8) | r) >>> 0; });
  const lut = new Uint32Array(65536);
  for (let code = 0; code < 65536; code++) if (code !== g.nodata) lut[code] = cols[classIndex(palette.stops, palette.domain, code * g.scale_factor + g.add_offset)];
  return lut;
}

// ---------------------------------------------------------------- canvas rendering
// One routine draws any Web Mercator box of the grid into a W x H canvas, nearest neighbour exactly
// as the pipeline and the product's tile renderer: each image pixel takes the grid cell containing
// its centre. Optionally the no-value cells get a hatch. The result is clipped to the sea.
// [colour, line width css px, spacing css px]; "dots" is the product's current 8 px hatch
const HATCH = { dots: ["rgba(170,196,224,0.26)", 1.5, 8], quiet: ["rgba(186,200,214,0.16)", 1, 12], light: ["rgba(70,84,100,0.28)", 1, 12], explicit: ["rgba(196,206,218,0.42)", 1.2, 12] };
function makePattern(kind, dpr) {
  const style = HATCH[kind];
  const s = style[2] * dpr; const c = document.createElement("canvas"); c.width = s; c.height = s; const g = c.getContext("2d");
  g.strokeStyle = style[0]; g.lineWidth = style[1] * dpr; g.lineCap = "butt";
  g.beginPath(); g.moveTo(-s / 2, s * 1.5); g.lineTo(s * 1.5, -s / 2); g.moveTo(-s, s); g.lineTo(s, -s); g.moveTo(0, 2 * s); g.lineTo(2 * s, 0); g.stroke();
  return c;
}
function renderBox({ g, codes, lut, box, W, H, withField, hatch, dpr = 1 }) {
  const x0 = mercX(box.west), x1 = mercX(box.east), y0 = mercY(box.north), y1 = mercY(box.south);
  const sx = W / (x1 - x0), sy = H / (y1 - y0);
  const canvas = document.createElement("canvas"); canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext("2d");
  let cells = 0;
  if (withField) {
    const colOf = new Int32Array(W), rowOf = new Int32Array(H);
    for (let px = 0; px < W; px++) { const lon = ((x0 + (px + 0.5) / sx) * 360) - 180; const c = Math.floor((lon - g.lon_first) / g.lon_step + 0.5); colOf[px] = c >= 0 && c < g.width ? c : -1; }
    for (let py = 0; py < H; py++) { const lat = latOfY(y0 + (py + 0.5) / sy); const r = Math.floor((lat - g.lat_first) / g.lat_step + 0.5); rowOf[py] = r >= 0 && r < g.height ? r : -1; }
    const img = ctx.createImageData(W, H);
    const out = new Uint32Array(img.data.buffer);
    for (let py = 0; py < H; py++) {
      const r = rowOf[py]; if (r < 0) continue;
      const base = r * g.width, o = py * W;
      for (let px = 0; px < W; px++) { const c = colOf[px]; if (c >= 0) out[o + px] = lut[codes[base + c]]; }
    }
    ctx.putImageData(img, 0, 0);
  }
  if (hatch) {
    const rMin = Math.max(0, Math.floor((box.south - g.lat_first) / g.lat_step + 0.5)), rMax = Math.min(g.height - 1, Math.floor((box.north - g.lat_first) / g.lat_step + 0.5));
    const cMin = Math.max(0, Math.floor((box.west - g.lon_first) / g.lon_step + 0.5)), cMax = Math.min(g.width - 1, Math.floor((box.east - g.lon_first) / g.lon_step + 0.5));
    ctx.beginPath();
    for (let r = rMin; r <= rMax; r++) {
      const yTop = (mercY(g.lat_first + (r + 0.5) * g.lat_step) - y0) * sy, yBot = (mercY(g.lat_first + (r - 0.5) * g.lat_step) - y0) * sy;
      for (let c = cMin; c <= cMax; c++) {
        if (codes[r * g.width + c] !== g.nodata) continue;
        const xl = (mercX(g.lon_first + (c - 0.5) * g.lon_step) - x0) * sx, xr = (mercX(g.lon_first + (c + 0.5) * g.lon_step) - x0) * sx;
        ctx.rect(xl, yTop, xr - xl, yBot - yTop); cells++;
      }
    }
    if (cells) { ctx.fillStyle = ctx.createPattern(makePattern(hatch, dpr), "repeat"); ctx.fill(); }
  }
  // clip to the sea: union of the water polygons into a mask, then destination-in
  const mask = document.createElement("canvas"); mask.width = W; mask.height = H;
  const m = mask.getContext("2d"); m.fillStyle = "#000";
  for (const ids of water.polygons) {
    const b = water.bbox[ids[0]];
    if (b[0] > x1 || b[2] < x0 || b[1] > y1 || b[3] < y0) continue;
    m.beginPath();
    for (const id of ids) { const r = water.rings[id]; for (let i = 0; i < r.length; i += 2) { const x = (r[i] - x0) * sx, y = (r[i + 1] - y0) * sy; i ? m.lineTo(x, y) : m.moveTo(x, y); } m.closePath(); }
    m.fill("evenodd");
  }
  ctx.globalCompositeOperation = "destination-in";
  ctx.drawImage(mask, 0, 0);
  return { canvas, cells, coordinates: [[box.west, box.north], [box.east, box.north], [box.east, box.south], [box.west, box.south]] };
}
const toBlobUrl = async (canvas) => { const blob = await new Promise((res) => canvas.toBlob(res, "image/png")); return { url: URL.createObjectURL(blob), bytes: blob.size }; };

// Whole grid -> one EPSG:3857 image (~4 px per cell), placed by its corners. MapLibre quantises an
// image source's placement (up to ~77 m here); the product's exact tile protocol has no such shift.
// Below DETAIL_Z this image is what you see; above it the viewport image takes over (its water
// clip is at device resolution, this one's is at ~0.75 km).
const imageCache = new Map();
async function renderWhole(layer, codes, lut, key) {
  if (imageCache.has(key)) return imageCache.get(key);
  const t0 = performance.now();
  const g = layer.grid, box = gridBounds(g);
  const W = g.width * UPSAMPLE;
  const H = Math.round((W * (mercY(box.south) - mercY(box.north))) / (mercX(box.east) - mercX(box.west)));
  const r = renderBox({ g, codes, lut, box, W, H, withField: true, hatch: null });
  const tRender = performance.now() - t0;
  const { url, bytes } = await toBlobUrl(r.canvas);
  const result = { url, width: W, height: H, bytes, tRender: +tRender.toFixed(0), tEncode: +(performance.now() - t0 - tRender).toFixed(0), coordinates: r.coordinates };
  imageCache.set(key, result);
  return result;
}

// Viewport image, re-rendered on moveend (120 ms debounce) with a 25 % margin: the no-value hatch at
// every zoom (crisp lines in device pixels), plus the field itself from DETAIL_Z.
let detailToken = 0, detailUrl = null;
async function refreshDetail() {
  const layer = layersFile.layers[state.layerId];
  const { codes } = await loadGrid(layer);
  const o = TREATMENTS[state.t];
  const token = ++detailToken;
  const g = layer.grid, gb = gridBounds(g), vb = map.getBounds();
  const margin = 0.25;
  const w0 = vb.getWest(), e0 = vb.getEast(), n0 = vb.getNorth(), s0 = vb.getSouth();
  const box = { west: Math.max(gb.west, w0 - (e0 - w0) * margin), east: Math.min(gb.east, e0 + (e0 - w0) * margin), north: Math.min(gb.north, n0 + (n0 - s0) * margin), south: Math.max(gb.south, s0 - (n0 - s0) * margin) };
  const src = map.getSource("detail");
  if (!src) return;
  if (!(box.east > box.west && box.north > box.south)) { src.updateImage({ url: EMPTY_PNG, coordinates: EMPTY_COORDS }); return; }
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const x0 = mercX(box.west), x1 = mercX(box.east), y0 = mercY(box.north), y1 = mercY(box.south);
  const scale = Math.min((map.getContainer().clientWidth * dpr * (1 + 2 * margin)) / (x1 - x0), 2048 / (x1 - x0), 2048 / (y1 - y0));
  const W = Math.max(2, Math.round((x1 - x0) * scale)), H = Math.max(2, Math.round((y1 - y0) * scale));
  const t0 = performance.now();
  const r = renderBox({ g, codes, lut: state.lut, box, W, H, withField: map.getZoom() >= DETAIL_Z, hatch: o.hatch, dpr });
  const { url, bytes } = await toBlobUrl(r.canvas);
  if (token !== detailToken) { URL.revokeObjectURL(url); return; }
  perf.detail = { width: W, height: H, pngBytes: bytes, ms: +(performance.now() - t0).toFixed(0), hatchedCells: r.cells };
  src.updateImage({ url, coordinates: r.coordinates });
  if (detailUrl) URL.revokeObjectURL(detailUrl);
  detailUrl = url;
}
const EMPTY_PNG = (() => { const c = document.createElement("canvas"); c.width = 2; c.height = 2; return c.toDataURL(); })();
const EMPTY_COORDS = [[-180, 85], [-179, 85], [-179, 84], [-180, 84]];

// ---------------------------------------------------------------- derived vector data from the grid
function cellEdges(g, codes) {
  const ok = (r, c) => r >= 0 && r < g.height && c >= 0 && c < g.width && codes[r * g.width + c] !== g.nodata;
  const latE = (r) => +(g.lat_first + (r - 0.5) * g.lat_step).toFixed(5);
  const lonE = (c) => +(g.lon_first + (c - 0.5) * g.lon_step).toFixed(5);
  const lines = [];
  for (let r = 0; r <= g.height; r++) { let s = -1; for (let c = 0; c <= g.width; c++) { const on = c < g.width && (ok(r - 1, c) || ok(r, c)); if (on && s < 0) s = c; if (!on && s >= 0) { lines.push([[lonE(s), latE(r)], [lonE(c), latE(r)]]); s = -1; } } }
  for (let c = 0; c <= g.width; c++) { let s = -1; for (let r = 0; r <= g.height; r++) { const on = r < g.height && (ok(r, c - 1) || ok(r, c)); if (on && s < 0) s = r; if (!on && s >= 0) { lines.push([[lonE(c), latE(s)], [lonE(c), latE(r)]]); s = -1; } } }
  return { type: "FeatureCollection", features: [{ type: "Feature", properties: {}, geometry: { type: "MultiLineString", coordinates: lines } }] };
}
function cellCentres(g, codes, palette, inkFor) {
  const features = [];
  for (let r = 0; r < g.height; r++) for (let c = 0; c < g.width; c++) {
    const code = codes[r * g.width + c]; if (code === g.nodata) continue;
    const v = code * g.scale_factor + g.add_offset;
    const k = classIndex(palette.stops, palette.domain, v);
    features.push({ type: "Feature", properties: { v: Math.round(v * 100), k, ink: inkFor(k) }, geometry: { type: "Point", coordinates: [+(g.lon_first + c * g.lon_step).toFixed(4), +(g.lat_first + r * g.lat_step).toFixed(4)] } });
  }

for (const [k, v] of Object.entries(PRESETS)) { const b = document.createElement("button"); b.textContent = v.label; b.dataset.k = k; b.onclick = () => apply(state.t, k, state.layerId); pGroup.append(b); }
variableSel.onchange = () => apply(state.t, state.p, variableSel.value, { move: false });
function syncButtons() {
  for (const b of tGroup.children) b.setAttribute("aria-pressed", String(b.dataset.k === state.t));
  for (const b of pGroup.children) b.setAttribute("aria-pressed", String(b.dataset.k === state.p));
}
let detailTimer = null;
map.on("moveend", () => { clearTimeout(detailTimer); detailTimer = setTimeout(() => refreshDetail().catch((e) => console.error("[carto] detail failed", e)), 120); });

window.__carto.apply = (t, p, v) => apply(t ?? state.t, p ?? state.p, v ?? state.layerId);
await apply(state.t, state.p, state.layerId);
</script>
