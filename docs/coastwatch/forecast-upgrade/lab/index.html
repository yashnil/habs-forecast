<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Map Lab · CoastWatch forecast upgrade</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <style>
    :root {
      --navy: #06111e; --sea: #0b1d33; --land: #2a3646; --paper: #f5f3ee; --surface: #fff; --line: #e4e0d7;
      --ink: #0d1b2a; --ink-2: #3d4b5c; --ink-3: #5f6b79; --accent: #0b6a85; --model: #6a3fb0; --obs: #14466e;
      --official: #9a4a00;
      --font: "IBM Plex Sans", system-ui, sans-serif; --display: "Newsreader", Georgia, serif; --mono: "IBM Plex Mono", ui-monospace, monospace;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 400 14px/1.45 var(--font); color: var(--ink); background: var(--sea); font-feature-settings: "tnum" 1, "lnum" 1; }
    header { height: 52px; display: flex; align-items: center; gap: 14px; padding: 0 20px; background: var(--navy); color: #e8eef5; }
    header b { font: 600 16px var(--font); color: #fff; }
    header span { color: #a9b8c9; font-size: 13px; }
    header .tag { margin-left: auto; padding: 4px 10px; border-radius: 999px; border: 1px solid rgb(246 187 92 / .5); color: #f6bb5c; font-size: 12.5px; }
    #map { position: fixed; inset: 52px 0 0 0; }
    .panel { position: absolute; z-index: 5; background: var(--surface); border-radius: 14px; box-shadow: 0 1px 2px rgb(6 17 30 / .12), 0 8px 24px rgb(6 17 30 / .18); }
    #side { top: 68px; left: 16px; width: 330px; max-height: calc(100vh - 84px); overflow: auto; padding: 14px 14px 12px; }
    h1 { font: 500 22px/1.2 var(--display); margin: 0 0 4px; }
    .lede { font-size: 13px; color: var(--ink-2); margin: 0 0 10px; }
    .eyebrow { font: 600 11px/1.3 var(--font); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin: 12px 0 6px; }
    .seg { display: flex; flex-wrap: wrap; gap: 4px; }
    .seg button { font: 500 12.5px var(--font); padding: 6px 9px; border-radius: 7px; border: 1px solid var(--line); background: #fff; color: var(--ink-2); cursor: pointer; }
    .seg button[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: #fff; }
    .layer { display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; padding: 7px 8px; border-radius: 8px; cursor: pointer; }
    .layer:hover { background: #faf9f6; }
    .layer input { margin-top: 3px; }
    .layer .n { font-weight: 500; }
    .layer .m { grid-column: 2; font-size: 12px; color: var(--ink-3); }
    .layer.disabled { opacity: .45; cursor: default; }
    .chip { display: inline-block; font: 600 10.5px var(--font); letter-spacing: .04em; text-transform: uppercase; padding: 1px 6px; border-radius: 999px; margin-right: 4px; }
    .chip.model { color: var(--model); background: #f3eefb; border: 1px solid #cdbcef; }
    .chip.obs { color: #0d756c; background: #e5f3f0; border: 1px solid #a6d6cf; }
    .chip.phys { color: #34495f; background: #eef1f5; border: 1px solid #cfd8e3; }
    .toggle { display: flex; gap: 8px; align-items: start; padding: 6px 8px; font-size: 13px; }
    .toggle small { display: block; color: var(--ink-3); font-size: 12px; }
    .note { font-size: 12px; color: var(--ink-3); border-top: 1px solid var(--line); margin-top: 10px; padding-top: 8px; }
    #dock { left: 362px; bottom: 16px; width: min(640px, calc(100vw - 378px - 16px)); padding: 12px 14px; }
    .dock-head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
    .dock-head b { font-weight: 600; }
    .dock-head span { font-size: 12.5px; color: var(--ink-3); }
    .days { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 3px; margin-top: 8px; }
    .day { border: 1px solid var(--line); border-radius: 6px; background: #fff; padding: 4px 2px 3px; cursor: pointer; display: grid; gap: 3px; justify-items: center; font: 500 11px var(--font); color: var(--ink-3); }
    .day .bar { width: 70%; height: 26px; background: #f0ede6; border-radius: 3px; position: relative; overflow: hidden; }
    .day .bar i { position: absolute; left: 0; right: 0; bottom: 0; background: #2a9a7c; }
    .day[aria-pressed="true"] { border-color: var(--navy); box-shadow: inset 0 0 0 1px var(--navy); color: var(--ink); }
    .legend { margin-top: 10px; display: grid; gap: 4px; }
    .ramp { height: 10px; border-radius: 3px; }
    .ticks { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-3); }
    .legend-row { display: flex; gap: 14px; align-items: center; font-size: 12px; color: var(--ink-3); flex-wrap: wrap; }
    .hatch { display: inline-block; width: 16px; height: 11px; border-radius: 2px; vertical-align: -1px; margin-right: 5px; background: repeating-linear-gradient(135deg, #0b1d33 0 3px, #556f8f 3px 4px); border: 1px solid #3a5070; }
    .res { font: 500 11.5px var(--mono); color: var(--ink-2); background: #f0ede6; border-radius: 4px; padding: 1px 5px; }
    #readout { position: absolute; z-index: 6; pointer-events: none; background: var(--navy); color: #e8eef5; border-radius: 9px; padding: 7px 10px; font-size: 12.5px; display: none; }
    #readout b { color: #fff; font-size: 16px; }
  </style>
</head>
<body>
  <header><b>CoastWatch</b><span>Map lab · forecast-upgrade research</span><span class="tag">Research prototype, real published data, not a product</span></header>
  <div id="map"></div>
  <aside id="side" class="panel"></aside>
  <section id="dock" class="panel"></section>
  <div id="readout"></div>
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script>
  (async function () {
    const META = await (await fetch("layers.json")).json();
    const REGIONS = {
      monterey: { label: "Monterey Bay", view: [[-122.42, 36.48], [-121.72, 37.14]] },
      north_coast: { label: "North Coast", view: [[-124.65, 40.45], [-123.95, 41.35]] },
      socal_bight: { label: "SoCal Bight", view: [[-119.0, 32.6], [-117.1, 34.1]] },
      state: { label: "Statewide", view: [[-126.2, 32.3], [-117.0, 42.2]] },
    };
    const PRODUCTS = {
      charm_native: { label: "C-HARM pDA, native cells", kind: "model", res: "3 km", note: "Each 0.03° cell drawn as a block (nearest)." },
      charm_display: { label: "C-HARM pDA, display interpolation", kind: "model", res: "3 km", note: "Bilinear between cell centres, only inside valid cells. Same data; boundaries are drawn, not measured." },
      olci300: { label: "OLCI chlorophyll-a (Sentinel-3A)", kind: "obs", res: "300 m", note: "Single overpass, NOAA CoastWatch NRT." },
      viirs750: { label: "VIIRS chlorophyll-a, 1-day", kind: "obs", res: "750 m", note: "CoastWatch West Coast composite." },
      viirs_n20: { label: "NOAA-20 VIIRS chlorophyll-a", kind: "obs", res: "4 km", note: "Global NRT product." },
      dineof: { label: "Gap-filled chlorophyll (DINEOF)", kind: "obs", res: "2 km", note: "VIIRS + OLCI, statistically gap-filled, science quality (≈12 days old)." },
    };
    const lidOf = (p, r) => ({ olci300: r === "socal_bight" ? "olci300_s3a_DI" : "olci300_s3a_CI", viirs750: "viirs750_1day", viirs_n20: "viirs_n20_4km", dineof: "dineof_2km_sq" })[p];
    const q = new URLSearchParams(location.search);
    const S = { region: q.get("region") || "monterey", product: q.get("layer") || "charm_native", date: q.get("date"), lead: Number(q.get("lead") ?? 1), currents: q.get("currents") === "1", drift: q.get("drift") === "1" };

    function layersFor(p, r) {
      if (p.startsWith("charm")) return META.layers.filter((l) => l.id.startsWith(p + "_lead")).sort((a, b) => a.lead - b.lead);
      if (r === "state") return [];
      const lid = lidOf(p, r);
      return META.layers.filter((l) => l.region === r && l.id.startsWith(`${r}_${lid}_`)).sort((a, b) => a.date.localeCompare(b.date));
    }
    function current() {
      const ls = layersFor(S.product, S.region);
      if (!ls.length) return null;
      if (S.product.startsWith("charm")) return ls.find((l) => l.lead === S.lead) ?? ls[1];
      return ls.find((l) => l.date === S.date) ?? ls.reduce((a, b) => (b.valid_cells / b.cells > a.valid_cells / a.cells ? b : a));
    }

    const SEA = "#0b1d33", LAND = "#2a3646";
    const map = new maplibregl.Map({
      container: "map", fadeDuration: 0, preserveDrawingBuffer: true, attributionControl: { compact: false },
      bounds: REGIONS[S.region].view, fitBoundsOptions: { padding: { left: 360, top: 30, right: 40, bottom: 210 } },
      style: {
        version: 8, glyphs: "https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf",
        sources: { omt: { type: "vector", url: "https://tiles.openfreemap.org/planet", attribution: "OpenFreeMap · © OpenMapTiles · © OpenStreetMap contributors" } },
        layers: [
          { id: "land", type: "background", paint: { "background-color": LAND } },
          { id: "water", type: "fill", source: "omt", "source-layer": "water", paint: { "fill-color": SEA } },
          { id: "water-nodata", type: "fill", source: "omt", "source-layer": "water", paint: { "fill-pattern": "hatch" } },
          { id: "anchor", type: "background", paint: { "background-opacity": 0 } },
          { id: "coastline", type: "line", source: "omt", "source-layer": "water", paint: { "line-color": "#d3dfeb", "line-width": ["interpolate", ["linear"], ["zoom"], 5, 0.6, 10, 1.3] } },
          { id: "city", type: "symbol", source: "omt", "source-layer": "place", minzoom: 7, filter: ["in", ["get", "class"], ["literal", ["city", "town"]]], layout: { "text-field": ["get", "name"], "text-font": ["Noto Sans Regular"], "text-size": 11.5 }, paint: { "text-color": "#c3cfdc", "text-halo-color": LAND, "text-halo-width": 1.3 } },
        ],
      },
    });
    window.__map = map;
    map.on("styleimagemissing", (e) => {
      if (e.id !== "hatch") return;
      const n = 8, c = document.createElement("canvas"); c.width = c.height = n;
      const g = c.getContext("2d"); g.strokeStyle = "rgba(150,178,210,0.26)"; g.lineWidth = 1;
      g.beginPath(); g.moveTo(0, n); g.lineTo(n, 0); g.moveTo(-1, 1); g.lineTo(1, -1); g.moveTo(n - 1, n + 1); g.lineTo(n + 1, n - 1); g.stroke();
      map.addImage("hatch", g.getImageData(0, 0, n, n));
    });
    map.addControl(new maplibregl.ScaleControl({ unit: "metric", maxWidth: 110 }), "bottom-right");

    async function setRaster() {
      const L = current();
      if (map.getLayer("data")) map.removeLayer("data");
      if (map.getSource("data")) map.removeSource("data");
      if (!L) return;
      map.addSource("data", { type: "image", url: L.url, coordinates: L.corners });
      map.addLayer({ id: "data", type: "raster", source: "data", paint: { "raster-resampling": "nearest", "raster-fade-duration": 0, "raster-opacity": 1 } }, "anchor");
    }
    async function setVectors() {
      for (const id of ["cur", "drift", "drift-end"]) { if (map.getLayer(id)) map.removeLayer(id); }
      for (const id of ["cur", "drift", "drift-end"]) { if (map.getSource(id)) map.removeSource(id); }
      if (S.currents) {
        map.addSource("cur", { type: "geojson", data: S.region === "monterey" ? META.currents.arrows_monterey : META.currents.arrows_state });
        map.addLayer({ id: "cur", type: "line", source: "cur", paint: { "line-color": "#e8eef5", "line-opacity": ["interpolate", ["linear"], ["get", "speed"], 0, 0.2, 0.4, 0.6], "line-width": 1 } });
      }
      if (S.drift) {
        map.addSource("drift", { type: "geojson", data: META.currents.drift_monterey });
        map.addLayer({ id: "drift", type: "line", source: "drift", paint: { "line-color": "#ff8fb1", "line-width": 2.2, "line-opacity": 0.95 } });
        const ends = { type: "FeatureCollection", features: (await (await fetch(META.currents.drift_monterey)).json()).features.filter((f) => f.geometry.coordinates.length > 1).map((f) => ({ type: "Feature", properties: f.properties, geometry: { type: "Point", coordinates: f.geometry.coordinates.at(-1) } })) };
        map.addSource("drift-end", { type: "geojson", data: ends });
        map.addLayer({ id: "drift-end", type: "circle", source: "drift-end", paint: { "circle-radius": 3, "circle-color": "#ff8fb1", "circle-stroke-color": "#06111e", "circle-stroke-width": 1 } });
      }
    }

    function sideHTML() {
      const L = current();
      return `
        <h1>Map lab</h1>
        <p class="lede">Real California data from ${META.currents.run.slice(0, 10)} and the preceding two weeks, each layer at its native resolution. For comparing data sources, not for decisions.</p>
        <p class="eyebrow">Region</p>
        <div class="seg">${Object.entries(REGIONS).map(([k, r]) => `<button data-region="${k}" aria-pressed="${S.region === k}">${r.label}</button>`).join("")}</div>
        <p class="eyebrow">Layer</p>
        ${Object.entries(PRODUCTS).map(([k, p]) => {
          const ok = layersFor(k, S.region).length > 0;
          return `<label class="layer ${ok ? "" : "disabled"}"><input type="radio" name="p" value="${k}" ${S.product === k ? "checked" : ""} ${ok ? "" : "disabled"} />
            <span class="n">${p.label}</span>
            <span class="m"><span class="chip ${p.kind}">${p.kind === "model" ? "Model" : "Satellite"}</span><span class="res">${p.res}</span> ${ok ? p.note : "Not fetched for this view."}</span></label>`;
        }).join("")}
        <p class="eyebrow">Ocean physics · WCOFS forecast</p>
        <label class="toggle"><input type="checkbox" data-t="currents" ${S.currents ? "checked" : ""} /><span>Surface currents <span class="chip phys">Model</span><small>${META.currents.native}. Arrows at +${Math.round(META.currents.hours.reduce((a, h) => (Math.abs(h - 21) < Math.abs(a - 21) ? h : a)) + 3)} h.</small></span></label>
        <label class="toggle"><input type="checkbox" data-t="drift" ${S.drift ? "checked" : ""} /><span>72-hour surface drift, Monterey Bay <span class="chip phys">Model</span><small>Where surface water starting in the bay may move under forecast currents. Not where a bloom will be.</small></span></label>
        <p class="note">${L ? `<b>${L.product}</b><br>${L.render === "nearest" ? "Drawn cell by cell (nearest)." : "Display interpolation between cell centres."} Native ${L.native}.${L.cells ? ` ${Math.round((100 * L.valid_cells) / L.cells)}% of the view has a value on ${L.date}.` : ` Valid ${L.date}${L.lead != null ? `, lead +${L.lead} d` : ""}.`}` : "No layer for this view."}</p>`;
    }
    function dockHTML() {
      const L = current();
      if (!L) return `<div class="dock-head"><b>No layer</b></div>`;
      const charm = S.product.startsWith("charm");
      const ls = layersFor(S.product, S.region);
      const steps = charm
        ? ls.map((l) => `<button class="day" data-lead="${l.lead}" aria-pressed="${l.lead === L.lead}">${l.lead === 0 ? "Now" : "+" + l.lead + "d"}<span>${l.date.slice(5)}</span></button>`).join("")
        : ls.map((l) => { const f = l.valid_cells / l.cells; return `<button class="day" data-date="${l.date}" aria-pressed="${l.date === L.date}" title="${Math.round(100 * f)}% of the view cloud-free"><span class="bar"><i style="height:${Math.max(2, 100 * f)}%"></i></span>${l.date.slice(8)}</button>`; }).join("");
      const legend = charm
        ? `<div class="ramp" style="background:linear-gradient(90deg,${["#3a385b", "#4c436a", "#5f4e79", "#735986", "#886492", "#9c709c", "#af7ea4", "#c28cab", "#d39cb3", "#e5abbc"].map((c, i) => `${c} ${i * 10}% ${(i + 1) * 10}%`).join(",")})"></div><div class="ticks"><span>0</span><span>20</span><span>40</span><span>60</span><span>80</span><span>100%</span></div><div class="legend-row"><span>Probability that particulate domoic acid exceeds 500 ng/L. 10-point display steps, not risk levels.</span></div>`
        : `<div class="ramp" style="background:linear-gradient(90deg,#102a4c,#14466e,#126483,#147f85,#2a9a7c,#5bb267,#9bc851,#d6dd5e,#f3ef9c)"></div><div class="ticks"><span>0.1</span><span>0.3</span><span>1</span><span>3</span><span>10</span><span>30 mg/m³</span></div><div class="legend-row"><span>Chlorophyll-a, log scale. Algae biomass, not toxin.</span></div>`;
      return `<div class="dock-head"><b>${charm ? "Forecast day" : "Overpass day · bar = share of the view with a value"}</b><span>${charm ? "C-HARM issues one run a day; leads beyond +3 d do not exist." : "Clouds and fog are the gaps."}</span></div>
        <div class="days">${steps}</div>
        <div class="legend">${legend}<div class="legend-row"><span><i class="hatch"></i>No value (cloud, fog, land mask or outside the product)</span><span class="res">native ${L.native}</span></div></div>`;
    }
    function render() {
      document.getElementById("side").innerHTML = sideHTML();
      document.getElementById("dock").innerHTML = dockHTML();
      const u = new URLSearchParams({ region: S.region, layer: S.product });
      const L = current(); if (L?.date && !S.product.startsWith("charm")) u.set("date", L.date);
      if (S.product.startsWith("charm")) u.set("lead", S.lead);
      if (S.currents) u.set("currents", 1); if (S.drift) u.set("drift", 1);
      history.replaceState(null, "", "?" + u);
    }
    document.addEventListener("click", (e) => {
      const t = e.target.closest("[data-region],[data-date],[data-lead]"); if (!t) return;
      if (t.dataset.region) { S.region = t.dataset.region; S.date = null; map.fitBounds(REGIONS[S.region].view, { padding: { left: 360, top: 30, right: 40, bottom: 210 }, duration: 0 }); }
      if (t.dataset.date) S.date = t.dataset.date;
      if (t.dataset.lead) S.lead = Number(t.dataset.lead);
      render(); setRaster(); setVectors();
    });
    document.addEventListener("change", (e) => {
      if (e.target.name === "p") { S.product = e.target.value; S.date = null; }
      if (e.target.dataset.t) S[e.target.dataset.t] = e.target.checked;
      render(); setRaster(); setVectors();
    });
    map.on("load", () => { setRaster(); setVectors(); map.once("idle", () => document.body.setAttribute("data-ready", "1")); });
    render();
  })();
  </script>
</body>
</html>
