name: CoastWatch CI

# One run per pushed commit. Pushes cover every branch: main, feature branches with or without a
# pull request, and draft PRs (a push run's checks are attached to the commit, so they show on
# the PR). There is deliberately no `pull_request` trigger: with both, every push to a PR branch
# ran the whole suite twice on the same commit and sent two failure emails ("Run failed" for the
# push run, "PR run failed" for the pull_request run). Check names stay `pipeline` and `web`.
on:
  push:
    paths:
      - "pipeline/**"
      - "coastwatch-web/**"
      - "schemas/**"
      - "data/curated/**"
      - ".github/workflows/coastwatch-ci.yml"
  workflow_dispatch:

# Read-only token: CI never writes to the repository.
permissions:
  contents: read

# A newer push to the same feature branch supersedes the older run; main is never cancelled
# (every main commit keeps its full result).
concurrency:
  group: coastwatch-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock
      - run: uv sync
      - name: Offline tests (recorded fixtures; the single live test is run by the data workflow)
        # four processes: ~3 min instead of ~12; the tests write only to their own temp dirs
        run: uv run pytest -rs -n 4
      - name: JSON Schema is in sync with the models
        run: uv run cwp schema && git diff --exit-code ../schemas
      - name: Committed web fixture data is reproducible
        # JSON only: PNG/gzip bytes can legitimately differ between zlib builds.
        run: |
          uv run cwp fixture --out ../coastwatch-web/tests/fixture-data/v1
          uv run cwp fixture --scenario charm-failed --out ../coastwatch-web/tests/fixture-data-failed/v1
          git diff --exit-code -- '../coastwatch-web/tests/*.json' '../coastwatch-web/tests/*.geojson'

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coastwatch-web
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: coastwatch-web/package-lock.json
      - run: npm ci
      - name: Generated types are in sync with schemas/v1
        run: npm run gen:types && git diff --exit-code src/generated
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Reuse the Next.js build cache (keyed on the lockfile and the sources)
        uses: actions/cache@v4
        with:
          path: coastwatch-web/.next/cache
          key: nextjs-${{ hashFiles('coastwatch-web/package-lock.json') }}-${{ hashFiles('coastwatch-web/src/**') }}
          restore-keys: nextjs-${{ hashFiles('coastwatch-web/package-lock.json') }}-
      - name: Production build + end-to-end tests on fixture data
        run: npm run test:e2e
      - name: Keep the browser-test evidence when a test fails
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            coastwatch-web/playwright-report
            coastwatch-web/test-results
          retention-days: 14
