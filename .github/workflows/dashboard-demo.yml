name: Dashboard snapshot smoke test

on:
  push:
    paths:
      - "dashboard/**"
      - ".github/workflows/dashboard-demo.yml"
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dashboard dependencies
        run: pip install -r dashboard/requirements.txt
      - name: Generate demo snapshot
        run: python dashboard/scripts/make_demo_snapshot.py --outdir dashboard/data --mask-fallback
