name: CoastWatch data refresh

# ERDDAP / GIBS / CDFW -> pipeline -> validation -> artifacts -> coastwatch-data branch.
#
# - build (read-only token): starts from the currently published dataset (last known good),
#   runs the pipeline, verifies new C-HARM data against ERDDAP, checks every manifest
#   reference, and refuses anything that is not a v1/ pipeline artifact.
# - publish (write token, no repository code checked out): replaces the coastwatch-data
#   branch with a single commit containing only that artifact. One ref update = atomic.
# - check (read-only): confirms the new version is served at the public URL with CORS.
#
# Scheduled workflows run only from the default branch.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: "production publishes to coastwatch-data (served by GitHub Pages); staging publishes to coastwatch-data-staging (never deployed to Pages, no review issues)"
        type: choice
        options: [production, staging]
        default: production

permissions: {}

concurrency:
  group: coastwatch-data-${{ inputs.channel || 'production' }}
  cancel-in-progress: false

env:
  DATA_BRANCH: ${{ inputs.channel == 'staging' && 'coastwatch-data-staging' || 'coastwatch-data' }}
  DATA_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ inputs.channel == 'staging' && 'coastwatch-data-staging' || 'coastwatch-data' }}/v1

jobs:
  build:
    runs-on: ubuntu-latest
    # a normal run takes about 5 minutes; a hang fails (and is reported) instead of running for hours
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      official_changed: ${{ steps.watch.outputs.changed }}
      alerts: ${{ steps.health.outputs.alerts }}
      new_alerts: ${{ steps.health.outputs.new_alerts }}
      cleared: ${{ steps.health.outputs.cleared }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Start from the published dataset (last known good)
        run: |
          mkdir -p publish
          if git ls-remote --exit-code --heads origin "$DATA_BRANCH" >/dev/null; then
            git fetch --depth 1 origin "$DATA_BRANCH"
            git --work-tree=publish checkout FETCH_HEAD -- v1
            git reset -q
          fi
          ls -la publish || true
          # how old the dataset this run starts from is (pipeline health: missed runs)
          echo "PREV_GENERATED_AT=$(jq -r '.generated_at // empty' publish/v1/manifest.json 2>/dev/null)" >> "$GITHUB_ENV"
      - name: Run pipeline
        working-directory: pipeline
        run: uv sync && uv run cwp run --out ../publish/v1
      - name: Watch official pages for changes since the last human review (never edits records)
        id: watch
        working-directory: pipeline
        run: uv run cwp watch-official --github-output "$GITHUB_OUTPUT" | tee ../watch-report.json
      - name: Verify new C-HARM data against ERDDAP (13 points x 12 layers)
        working-directory: pipeline
        run: uv run cwp verify-charm --only-if-updated --out ../publish/v1 --report ../publish/v1/verification/charm-points.json
      - name: Verify new satellite chlorophyll against ERDDAP (values, cell centres, tiles, composite)
        working-directory: pipeline
        run: uv run cwp verify-satellite --only-if-updated --out ../publish/v1 --report ../publish/v1/verification/satellite-points.json
      - name: Verify new HF-radar currents against ERDDAP (values, cell centres, dropped cells, 24 h mean)
        working-directory: pipeline
        run: uv run cwp verify-currents --only-if-updated --out ../publish/v1 --report ../publish/v1/verification/currents-points.json
      - name: Every manifest reference exists and decodes
        working-directory: pipeline
        run: uv run cwp check-published --base ../publish/v1
      - name: Pipeline health (alerts for a person; never withholds valid data)
        id: health
        working-directory: pipeline
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: uv run cwp health --out ../publish/v1 --previous-generated-at "$PREV_GENERATED_AT" --markdown ../health-report.md --github-output "$GITHUB_OUTPUT" --run-url "$RUN_URL"
      - uses: actions/upload-artifact@v6
        with:
          name: health-report
          path: health-report.md
          retention-days: 7
      - name: Only pipeline artifacts may be published
        working-directory: pipeline
        run: uv run cwp guard-publish --root ../publish
      - uses: actions/upload-artifact@v6
        with:
          name: coastwatch-data
          path: publish/
          include-hidden-files: false
          retention-days: 7

  notify-review:
    # Official pages changed (or could not be read): ask a person to review the registry.
    needs: build
    if: needs.build.outputs.official_changed == 'true' && (inputs.channel || 'production') == 'production'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the review issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Official notices: sources changed since last review"
          body="The official-notice watcher for Neritic (formerly CoastWatch) detected changes (or could not read) official CDFW/CDPH pages since the last human review. The app shows official notices as NOT verified until a person checks every record in data/curated/official_notices.json against the sources and runs: cwp review-official --reviewer NAME --confirm. Details: ${RUN_URL} (job build, step 'Watch official pages')."
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body "$body"; else gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"; fi

  notify-health:
    # Production only. One issue for pipeline health: opened when an alert appears, commented
    # only when alerts change (new or cleared), closed when everything is clear again.
    needs: [build, check]
    if: (inputs.channel || 'production') == 'production'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: health-report
      - name: Open, update or close the health issue
        env:
          GH_TOKEN: ${{ github.token }}
          ALERTS: ${{ needs.build.outputs.alerts }}
          NEW: ${{ needs.build.outputs.new_alerts }}
          CLEARED: ${{ needs.build.outputs.cleared }}
        run: |
          # the legacy title is an identifier: the open issue is found by its exact title, so a new
          # title would open a duplicate and leave the old issue open (docs/coastwatch/brand/neritic.md)
          title="CoastWatch pipeline health"
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ "${ALERTS:-0}" -gt 0 ]; then
            if [ -z "$n" ]; then gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file health-report.md
            elif [ "${NEW:-0}" -gt 0 ] || [ "${CLEARED:-0}" -gt 0 ]; then gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body-file health-report.md
            fi
          elif [ -n "$n" ]; then
            gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body-file health-report.md
            gh issue close "$n" --repo "$GITHUB_REPOSITORY"
          fi

  notify-failure:
    # Production only: the refresh failed (build, verification, publish or the public check)
    # or was cancelled, which is how a run that hits its time limit ends (run 38116032798 hung
    # on an upstream server and was cancelled silently before this covered cancellations).
    # The previously published dataset stays live with its own dates.
    #
    # One open issue for all failures. A repeat of the same failure (same job and result) is
    # not commented again within 24 hours, so a 6-hourly schedule stuck on one outage adds at
    # most one comment a day; a different failure is reported at once. notify-recovered
    # closes the issue when a refresh publishes again.
    needs: [build, publish, check]
    if: (failure() || cancelled()) && (inputs.channel || 'production') == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          BUILD: ${{ needs.build.result }}
          PUBLISH: ${{ needs.publish.result }}
          CHECK: ${{ needs.check.result }}
        run: |
          title="CoastWatch data refresh failed"
          # the first job that did not succeed, and how it ended
          kind=""
          for j in "build:$BUILD" "publish:$PUBLISH" "check:$CHECK"; do
            case "${j#*:}" in failure|cancelled) kind="$j"; break ;; esac
          done
          [ -n "$kind" ] || kind="run:cancelled"
          case "$kind" in
            *:cancelled) what="was cancelled in the ${kind%%:*} job (it hit its time limit, or someone stopped it)" ;;
            *) what="failed in the ${kind%%:*} job" ;;
          esac
          marker="<!-- cw-refresh-failure: $kind -->"
          body="The data refresh ($EVENT) $what: ${RUN_URL}

          Nothing new was published; the previous dataset stays live with its own dates and the app shows its freshness. Check the job's log (verification failures block publication on purpose).

          $marker"
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -z "$n" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
            exit 0
          fi
          # the latest report on the issue: its last comment, else the issue itself
          last=$(gh api "repos/$GITHUB_REPOSITORY/issues/$n/comments?per_page=100" --jq 'last // empty | {created_at, body}')
          [ -n "$last" ] || last=$(gh api "repos/$GITHUB_REPOSITORY/issues/$n" --jq '{created_at, body}')
          last_at=$(jq -r .created_at <<<"$last")
          age=$(( $(date +%s) - $(date -d "$last_at" +%s) ))
          if jq -r .body <<<"$last" | grep -qF "$marker" && [ "$age" -lt 86400 ]; then
            echo "Same failure ($kind) already reported $((age / 3600)) h ago on #$n; not commenting again."
          else
            gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body "$body"
          fi

  notify-recovered:
    # Production only: a refresh published and was served again; close the failure issue.
    needs: [check]
    if: success() && (inputs.channel || 'production') == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Close the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="CoastWatch data refresh failed"
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$n" ]; then
            gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body "Recovered: ${RUN_URL} published a new dataset and it is served at the public URL."
            gh issue close "$n" --repo "$GITHUB_REPOSITORY"
          fi

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: coastwatch-data
          path: publish
      - name: Replace the data branch with this dataset (single commit)
        working-directory: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q
          git checkout -q --orphan "$DATA_BRANCH"
          git config user.name "coastwatch-bot"
          git config user.email "coastwatch-bot@users.noreply.github.com"
          git add v1
          git status --short | head -5
          # nothing outside v1/ may be staged
          if git diff --cached --name-only | grep -v '^v1/'; then echo "refusing: files outside v1/"; exit 1; fi
          git commit -q -m "data: run ${GITHUB_RUN_ID} (${GITHUB_SHA::12})"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${DATA_BRANCH}"

  check:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: New version is live at the public URL, complete, and CORS-enabled
        working-directory: pipeline
        run: |
          uv sync
          # raw.githubusercontent.com caches files for up to ~5 minutes: retry until this run is served
          uv run cwp check-published --base "$DATA_URL" --expect-run "$GITHUB_RUN_ID" --retries 24 --wait 20 --report ../published-check.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: published-check
          path: published-check.json
          if-no-files-found: ignore
